spring.application.name=portfolio-backend
server.port=${PORT:8080}

# Asli values yahan nahi likhni. Local ke liye backend/local.properties, Render ke liye Environment Variables.
spring.config.import=optional:file:./local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.sql.init.mode=always
app.seed.enabled=${SEED_ENABLED:true}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}