spring.application.name=portfolio-backend
server.port=8080

# --- PostgreSQL (defaults match docker-compose.yml; override with environment variables) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portfolio_safdar}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:safdar}

# Runs src/main/resources/schema.sql on every start (it only creates the table if missing)
spring.sql.init.mode=always

# --- Seeding ---
# true  = on every start, copy portfolio-data.json into PostgreSQL (edit the JSON, restart, done)
# false = leave the database alone (edit the data with SQL instead)
app.seed.enabled=${SEED_ENABLED:true}

# --- CORS: which website addresses may call the API (comma separated) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
