# Starts PostgreSQL for the backend:   docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: portfolio-postgres
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - portfolio-pgdata:/var/lib/postgresql/data

volumes:
  portfolio-pgdata:
